[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openstargazer"
version = "0.5.0"
description = "Native Linux driver for Tobii Eye Tracker 5 with OpenTrack & Star Citizen integration"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "1psconstructor"},
]
keywords = ["tobii", "eye-tracking", "head-tracking", "star-citizen", "opentrack", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "numpy>=1.24",
    "pyusb>=1.2",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
gui  = ["pygobject>=3.44"]
tray = ["pystray>=0.19"]
# Head rotation from the camera. Optional on purpose: without it the ET5
# still delivers gaze, position and roll, and the source says plainly
# which axes are missing and why. No model file is fetched by this.
camera = ["onnxruntime>=1.17"]
dev  = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://github.com/1psconstructor/openstargazer"
Repository = "https://github.com/1psconstructor/openstargazer"
"Bug Tracker" = "https://github.com/1psconstructor/openstargazer/issues"

[project.scripts]
osg-daemon = "openstargazer.daemon.main:main"
osg-config  = "gui.app:main"
osg-setup   = "openstargazer.setup.wizard:main"
# Meant to be bound to a key in the desktop's shortcut editor — a Wayland
# client cannot grab a global hotkey for itself.
osg-recenter = "openstargazer.ipc.cli:main"
# Its own program because the tray stack is GTK 3 and the config window is
# GTK 4; the two cannot share a process.
osg-tray = "gui.tray_app:main"

[tool.hatch.build.targets.wheel]
packages = ["openstargazer", "gui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
